name: Render Video Bake

on:
  workflow_dispatch:
    inputs:
      room_id:
        description: Room ID yang akan di-Bake
        required: true
        type: string
      job_id:
        description: Render job ID dari Firestore (disarankan)
        required: false
        type: string
      resolution:
        description: Resolusi output
        required: true
        default: "720"
        type: choice
        options:
          - "480"
          - "720"
          - "1080"

permissions:
  contents: read

concurrency:
  group: vibeit-render-${{ inputs.room_id }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      WORKER_FFMPEG_PRESET: ${{ vars.WORKER_FFMPEG_PRESET || 'medium' }}
      WORKER_DOWNLOAD_WORKERS: ${{ vars.WORKER_DOWNLOAD_WORKERS || '4' }}
      WORKER_PROXY_WORKERS: ${{ vars.WORKER_PROXY_WORKERS || '2' }}
      WORKER_MAX_MEDIA_BYTES: ${{ vars.WORKER_MAX_MEDIA_BYTES || '2147483648' }}
      WORKER_MAX_TIMELINE_BYTES: ${{ vars.WORKER_MAX_TIMELINE_BYTES || '921600' }}

    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Ensure FFmpeg and system fonts
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1 \
            && command -v ffprobe >/dev/null 2>&1 \
            && command -v fc-match >/dev/null 2>&1 \
            && fc-match "DejaVu Sans" | grep -qi "DejaVu"; then
            echo "FFmpeg dan font render sudah tersedia di runner."
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              ffmpeg fontconfig fonts-dejavu-core fonts-liberation
          fi

      - name: Install runtime dependencies
        run: python -m pip install --requirement requirements-runtime.txt

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          for name in FIREBASE_SERVICE_ACCOUNT B2_KEY_ID B2_APPLICATION_KEY B2_BUCKET_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret $name belum tersedia"
              missing=1
            fi
          done
          exit "$missing"

      - name: Render and upload final video
        shell: bash
        run: |
          args=(
            --room_id "${{ inputs.room_id }}"
            --resolution "${{ inputs.resolution }}"
          )
          if [ -n "${{ inputs.job_id }}" ]; then
            args+=(--job_id "${{ inputs.job_id }}")
          fi
          python render.py "${args[@]}"

      - name: Mark failed Bake job
        if: ${{ failure() && inputs.job_id != '' }}
        shell: bash
        env:
          BAKE_FAILURE_MESSAGE: >-
            Pipeline GitHub Actions gagal sebelum Bake selesai.
            Periksa run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: >-
          python mark_failed.py
          --job_id "${{ inputs.job_id }}"
          --message "$BAKE_FAILURE_MESSAGE"
